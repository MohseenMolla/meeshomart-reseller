<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00796b"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  {/* Background */}
  <rect width="1600" height="520" rx="24" fill="url(#bgGrad)"/>
  
  {/* Modern Geometric Accent Waves */}
  <path d="M 1100 0 Q 1350 200 1600 80 L 1600 520 L 1050 520 Q 1300 320 1100 0 Z" fill="#e6fffa" opacity="0.7"/>
  <circle cx="1450" cy="120" r="180" fill="#ccfbf1" opacity="0.5"/>
  <circle cx="150" cy="460" r="120" fill="#fef3c7" opacity="0.6"/>

  {/* Left Content Area */}
  {/* Logo / Badge */}
  <g transform="translate(80, 55)">
    <rect width="210" height="42" rx="21" fill="url(#primaryGrad)"/>
    <text x="105" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="0.5">MeeshoMart Dropship</text>
  </g>

  {/* Big Headline */}
  <g transform="translate(80, 155)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#0f172a" letter-spacing="-1">
      One-Click Order Processing,
    </text>
    <text y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#00796b" letter-spacing="-1">
      We Deliver The Rest!
    </text>
  </g>

  {/* Subtitle */}
  <g transform="translate(80, 275)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#475569">
      No inventory or packaging worries. Generate sales from home while we
    </text>
    <text y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#475569">
      package, verify, and deliver parcels directly to your customer across 64 districts.
    </text>
  </g>

  {/* 4 Feature Badges (Matching dropshipping.com.bd) */}
  <g transform="translate(80, 375)">
    {/* Badge 1 */}
    <g transform="translate(0, 0)">
      <rect width="180" height="48" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
      <circle cx="28" cy="24" r="12" fill="#ecfdf5"/>
      <path d="M22 24 L26 28 L34 20" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1e293b">1-Click Order</text>
    </g>

    {/* Badge 2 */}
    <g transform="translate(200, 0)">
      <rect width="185" height="48" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
      <circle cx="28" cy="24" r="12" fill="#fff7ed"/>
      <path d="M22 24 L26 28 L34 20" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1e293b">Zero Investment</text>
    </g>

    {/* Badge 3 */}
    <g transform="translate(405, 0)">
      <rect width="195" height="48" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
      <circle cx="28" cy="24" r="12" fill="#eff6ff"/>
      <path d="M22 24 L26 28 L34 20" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1e293b">Fast COD Delivery</text>
    </g>

    {/* Badge 4 */}
    <g transform="translate(620, 0)">
      <rect width="190" height="48" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
      <circle cx="28" cy="24" r="12" fill="#fdf4ff"/>
      <path d="M22 24 L26 28 L34 20" stroke="#c026d3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1e293b">bKash/Nagad Profit</text>
    </g>
  </g>

  {/* Right Side Illustration (Mobile Phone + Delivery Box + Van Artwork) */}
  <g transform="translate(1020, 60)" filter="url(#cardShadow)">
    {/* Smartphone Frame */}
    <rect x="120" y="30" width="220" height="380" rx="32" fill="#0f172a" stroke="#334155" stroke-width="4"/>
    <rect x="132" y="44" width="196" height="352" rx="22" fill="#ffffff"/>
    
    {/* Screen Header */}
    <rect x="145" y="65" width="170" height="28" rx="6" fill="#f1f5f9"/>
    <rect x="155" y="74" width="70" height="10" rx="3" fill="#00796b"/>
    <circle cx="300" cy="79" r="6" fill="#059669"/>

    {/* Product Card on Screen */}
    <rect x="145" y="105" width="170" height="150" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="155" y="115" width="150" height="85" rx="8" fill="#e2e8f0"/>
    <circle cx="230" cy="157" r="22" fill="#00796b" opacity="0.2"/>
    <rect x="155" y="210" width="100" height="10" rx="3" fill="#1e293b"/>
    <rect x="155" y="226" width="60" height="12" rx="3" fill="#059669"/>
    <rect x="255" y="226" width="50" height="12" rx="3" fill="#f97316"/>

    {/* Order Button on Phone */}
    <rect x="145" y="270" width="170" height="42" rx="10" fill="url(#primaryGrad)"/>
    <text x="230" y="296" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" text-anchor="middle">Confirm Order</text>

    {/* Delivery Status Flow */}
    <rect x="145" y="325" width="170" height="52" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
    <circle cx="165" cy="351" r="10" fill="#059669"/>
    <path d="M160 351 L164 355 L170 348" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="185" y="347" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#065f46">Parcel Shipped</text>
    <text x="185" y="362" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#047857">Steadfast / Pathao</text>

    {/* 3D Parcel Box floating */}
    <g transform="translate(10, 210)">
      <polygon points="50,20 110,0 170,20 110,40" fill="#f59e0b"/>
      <polygon points="50,20 110,40 110,105 50,85" fill="#d97706"/>
      <polygon points="170,20 110,40 110,105 170,85" fill="#b45309"/>
      {/* Tape */}
      <polygon points="98,4 122,-4 122,36 98,44" fill="#ffffff" opacity="0.6"/>
      <polygon points="98,44 122,36 122,101 98,109" fill="#ffffff" opacity="0.6"/>
    </g>

    {/* Delivery Truck Badge floating */}
    <g transform="translate(240, 280)">
      <rect width="130" height="54" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <circle cx="30" cy="27" r="15" fill="#00796b"/>
      {/* Simple Truck Icon */}
      <path d="M22 27 L28 27 L32 23 L36 23 L38 27 L38 31 L22 31 Z" fill="#ffffff"/>
      <circle cx="26" cy="32" r="2.5" fill="#0f172a"/>
      <circle cx="34" cy="32" r="2.5" fill="#0f172a"/>
      <text x="54" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#0f172a">COD 64 Dist.</text>
      <text x="54" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#059669">24-48h Delivery</text>
    </g>
  </g>
</svg>
