# Local/staging stack. Production should use MongoDB Atlas + managed Redis (see docs/deployment/README.md).
services:
  mongo:
    image: mongo:7
    command: ["--replSet","rs0","--bind_ip_all"]   # replica set is REQUIRED for transactions
    healthcheck:
      test: ["CMD","mongosh","--quiet","--eval","try{rs.status().ok}catch(e){rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok}"]
      interval: 5s
      retries: 20
    volumes: ["mongo-data:/data/db"]
  redis:
    image: redis:7
    volumes: ["redis-data:/data"]
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/reseller?replicaSet=rs0
      REDIS_URL: redis://redis:6379
    depends_on: { mongo: { condition: service_healthy }, redis: { condition: service_started } }
    ports: ["4000:4000"]
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile, args: { API_INTERNAL_URL: "http://api:4000" } }
    ports: ["3000:3000"]
    depends_on: [api]
volumes: { mongo-data: {}, redis-data: {} }
